# /etc/wireguard/wg0.conf — servidor WireGuard en VM1
# Generar claves en cada equipo:  wg genkey | tee privatekey | wg pubkey > publickey
# Guardar con permisos 600. Nunca publicar la clave privada.
[Interface]
Address    = 10.0.0.1/24
ListenPort = 51820
PrivateKey = <CLAVE_PRIVADA_SERVIDOR>
PostUp   = iptables -t nat -A POSTROUTING -o enp0s3 -j MASQUERADE
PostDown = iptables -t nat -D POSTROUTING -o enp0s3 -j MASQUERADE

# Cliente remoto
[Peer]
PublicKey  = <CLAVE_PUBLICA_CLIENTE>
AllowedIPs = 10.0.0.2/32

# --- Configuración del cliente (equipo del administrador) ---
# [Interface]
# PrivateKey = <CLAVE_PRIVADA_CLIENTE>
# Address    = 10.0.0.2/24
#
# [Peer]
# PublicKey  = <CLAVE_PUBLICA_SERVIDOR>
# Endpoint   = 192.168.1.10:51820
# AllowedIPs = 0.0.0.0/0
