# /etc/keepalived/keepalived.conf — VM1 (MASTER)
vrrp_instance VI_1 {
    state MASTER
    interface enp0s8
    virtual_router_id 51
    priority 101
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass CAMBIAR_CLAVE_VRRP   # misma clave en ambos nodos
    }

    virtual_ipaddress {
        192.168.1.100
    }
}
